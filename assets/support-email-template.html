<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Support Message - Face By You</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f0e8;
            margin: 0;
            padding: 0;
            color: #383643;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #f4f0e8;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(184, 145, 247, 0.1);
            border: 1px solid rgba(184, 145, 247, 0.2);
        }
        .header {
            background-color: #b891f7;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            color: #f4f0e8;
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
            font-weight: 700;
        }
        .content {
            padding: 40px;
        }
        .meta-item {
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(184, 145, 247, 0.1);
            padding-bottom: 10px;
        }
        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #565364;
            display: block;
            margin-bottom: 5px;
        }
        .value {
            font-size: 16px;
            font-weight: 600;
            color: #383643;
        }
        .message-box {
            background-color: rgba(184, 145, 247, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-top: 30px;
            border-left: 4px solid #b891f7;
        }
        .message-text {
            font-size: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            color: #383643;
        }
        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #565364;
            background-color: rgba(184, 145, 247, 0.03);
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background-color: #b891f7;
            color: #f4f0e8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>FACE BY YOU</h1>
        </div>
        <div class="content">
            <div class="badge">{{TYPE}} Report</div>
            
            <div class="meta-item">
                <span class="label">From</span>
                <span class="value">{{USER_NAME}}</span>
            </div>
            
            <div class="meta-item">
                <span class="label">Email Address</span>
                <span class="value">{{USER_EMAIL}}</span>
            </div>

            <div class="meta-item">
                <span class="label">Timestamp</span>
                <span class="value">{{TIMESTAMP}}</span>
            </div>

            <div class="message-box">
                <span class="label">Message Contents</span>
                <div class="message-text">
                    {{MESSAGE}}
                </div>
            </div>
        </div>
        <div class="footer">
            &copy; 2026 Face By You. Sent via Mobile App Feedback System.
        </div>
    </div>
</body>
</html>
